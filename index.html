<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Interactive Flipbook — Cerita Rakyat Digital yang bisa dibaca dengan efek membalik halaman secara interaktif.">
  <title>Cerita Rakyat Digital — Interactive Flipbook</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================
       MOBILE LANDSCAPE WARNING
  ============================================= -->
  <div class="landscape-warning">
    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#F5E6C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="rotate-icon">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <p>Mohon putar perangkat Anda ke posisi <strong>Portrait</strong><br>untuk pengalaman membaca yang optimal.</p>
  </div>

  <!-- ============================================
       HEADER — Judul & Branding
  ============================================= -->
  <div class="header-vintage">
      <h1 class="judul-buku">Jejak Waktu Kedunggudel</h1>
  </div>

  <!-- ============================================
       FLIPBOOK CONTAINER
       StPageFlip akan me-render canvas/div di sini
  ============================================= -->
  <main class="flipbook-wrapper" id="flipbook-wrapper">
    <button class="btn-side prev" id="btn-prev" aria-label="Halaman Sebelumnya">❮</button>
    <div id="flipbook" class="flipbook"></div>
    <button class="btn-side next" id="btn-next" aria-label="Halaman Berikutnya">❯</button>
  </main>

  <!-- ============================================
       FOOTER
  ============================================= -->
  <footer class="app-footer" id="app-footer">
    <div class="page-indicator" id="btn-nav-trigger" style="cursor: pointer;" title="Klik untuk melompat ke halaman lain">
      <span id="current-page">1</span> / <span id="total-pages">6</span>
    </div>
    <p>Dibuat dengan ❤️ untuk pelestarian budaya lokal</p>
  </footer>

  <!-- ============================================
       StPageFlip Library via CDN
  ============================================= -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <!-- ============================================
       INSTRUCTION MODAL
  ============================================= -->
  <div id="instruction-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>Panduan Membaca</h2>
      <p>Geser layar atau klik ujung kertas untuk membalik halaman seperti membaca buku sungguhan.</p>
      <button id="modal-close-btn" class="modal-close-btn">Mulai Membaca</button>
    </div>
  </div>

  <!-- ============================================
       IMAGE ZOOM MODAL (LIGHTBOX)
  ============================================= -->
  <div id="image-zoom-modal" class="modal-overlay hidden" style="z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <button id="zoom-close-btn" aria-label="Tutup" title="Tutup">&times;</button>
    <img id="zoomed-image" src="" alt="Zoomed Image">
  </div>

  <!-- Application Script -->
  <script src="script.js"></script>
  <!-- ============================================
       QUICK JUMP NAVIGATION MODAL
  ============================================= -->
  <div class="nav-overlay" id="nav-overlay">
    <div class="nav-modal" id="nav-modal">
      <h3 style="text-align: center; margin-bottom: 15px; color: var(--color-primary); font-family: var(--font-serif); letter-spacing: 1px; text-shadow: 1px 1px 0px rgba(255,255,255,0.7);">Navigasi Halaman</h3>
      <div class="nav-list" id="nav-list">
        <!-- Tombol nomor halaman akan di-generate oleh script.js -->
      </div>
    </div>
  </div>

</body>
</html>
