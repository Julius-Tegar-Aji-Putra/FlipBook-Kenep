<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Interactive Flipbook — Cerita Rakyat Digital yang bisa dibaca dengan efek membalik halaman secara interaktif.">
  <title>Cerita Rakyat Digital — Interactive Flipbook</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================
       HEADER — Judul & Branding
  ============================================= -->
  <div class="header-vintage">
      <h1 class="judul-buku">Jejak Waktu Kedunggudel</h1>
  </div>

  <!-- ============================================
       FLIPBOOK CONTAINER
       StPageFlip akan me-render canvas/div di sini
  ============================================= -->
  <main class="flipbook-wrapper" id="flipbook-wrapper">
    <button class="btn-side prev" id="btn-prev" aria-label="Halaman Sebelumnya">❮</button>
    <div id="flipbook" class="flipbook"></div>
    <button class="btn-side next" id="btn-next" aria-label="Halaman Berikutnya">❯</button>
  </main>

  <!-- ============================================
       FOOTER
  ============================================= -->
  <footer class="app-footer" id="app-footer">
    <div class="page-indicator" id="page-indicator">
      <span id="current-page">1</span> / <span id="total-pages">6</span>
    </div>
    <p>Dibuat dengan ❤️ untuk pelestarian budaya lokal</p>
  </footer>

  <!-- ============================================
       StPageFlip Library via CDN
  ============================================= -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <!-- ============================================
       INSTRUCTION MODAL
  ============================================= -->
  <div id="instruction-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>Panduan Membaca</h2>
      <p>Geser layar atau klik ujung kertas untuk membalik halaman seperti membaca buku sungguhan.</p>
      <button id="modal-close-btn" class="modal-close-btn">Mulai Membaca</button>
    </div>
  </div>

  <!-- Application Script -->
  <script src="script.js"></script>
</body>
</html>
